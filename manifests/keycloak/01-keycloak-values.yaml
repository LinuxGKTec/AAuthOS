# Helm values for the Bitnami Keycloak chart (fallback IDP).
image:
  registry: docker.io
  repository: bitnamilegacy/keycloak # <--- Changed from bitnami/keycloak
  tag: 24.0.5-debian-12-r1
  pullPolicy: IfNotPresent

auth:
  adminUser: admin
  adminPassword: admin
  managementUser: manager
  managementPassword: manager

replicaCount: 1
production: false
proxy: edge

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

service:
  type: NodePort
  nodePorts:
    http: 30808

ingress:
  enabled: true
  ingressClassName: nginx
  hostname: keycloak.aauth.local
  tls: false

# Import the demo realm at startup.
keycloakConfigCli:
  enabled: true
  existingConfigmap: keycloak-realm-import
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak-config-cli  # <--- Fix: Point this to bitnamilegacy
    tag: 5.12.0-debian-12-r6                      # <--- Fix: Specify the exact tag it's looking for
    pullPolicy: IfNotPresent

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql # <--- Changed from bitnami/postgresql
    tag: 16.3.0-debian-12-r16
    pullPolicy: IfNotPresent
  auth:
    database: keycloak
    postgresPassword: postgres
  primary:
    persistence:
      enabled: true
      storageClass: standard
      size: 2Gi
